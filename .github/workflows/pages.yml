name: Deploy demo to GitHub Pages

# Builds the GitHub Pages demo (`npm run build:pages`: base /Curtain-shop-web-site-frontend/,
# demo products, no backend) and publishes dist/ to the gh-pages branch, which is the
# branch GitHub Pages already serves. Pull requests only build, they never deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Publish dist/ to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "Deploy demo from ${{ github.sha }}"
